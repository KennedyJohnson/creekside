<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creekside</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1a14; }
  iframe { border: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<script type="module">
  // The audio engine lives here and survives the game iframe reloading between chapters.
  import * as audio from "./src/audio.js";
  window.creekAudio = audio;
  const f = document.createElement("iframe");
  f.src = "game.html" + location.hash;
  f.allow = "autoplay; gamepad; fullscreen";
  f.addEventListener("load", () => f.contentWindow.focus());
  document.body.appendChild(f);
  window.addEventListener("pointerdown", () => audio.initAudio());
</script>
</body>
</html>
